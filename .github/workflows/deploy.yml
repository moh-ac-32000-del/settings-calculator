name: Deploy settings-calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract standalone app
        run: |
          tar -xzf project-backup.tar.gz -C .
          echo "Application package:"
          find . -maxdepth 4 -path "*/package.json" -print

      - name: Apply calculator archive updates
        run: python3 apply-archive-update.py

      - name: Persist source archive update
        if: github.actor != 'github-actions[bot]'
        run: |
          tar -czf project-backup.tar.gz --exclude='node_modules' --exclude='.git' .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-backup.tar.gz
          git diff --cached --quiet || git commit -m "fix: update archive controls [skip ci]"
          git push

      - name: Add PWA files
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          from pathlib import Path

          Path("public").mkdir(exist_ok=True)

          manifest = '''{
            "name": "Settings Calculator",
            "short_name": "Calculator",
            "description": "Business pricing calculator",
            "id": "/settings-calculator/",
            "lang": "ar",
            "dir": "rtl",
            "start_url": "/settings-calculator/",
            "scope": "/settings-calculator/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#0b0d12",
            "theme_color": "#0b0d12",
            "icons": [
              {"src":"/settings-calculator/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/settings-calculator/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},
              {"src":"/settings-calculator/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"/settings-calculator/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }\n'''
          Path("public/manifest.webmanifest").write_text(manifest, encoding="utf-8")

          sw = '''const CACHE = "settings-calculator-v2";
          const BASE = "/settings-calculator/";
          self.addEventListener("install", (event) => {
            event.waitUntil(caches.open(CACHE).then((cache) => cache.addAll([BASE, BASE + "manifest.webmanifest"])).then(() => self.skipWaiting()));
          });
          self.addEventListener("activate", (event) => {
            event.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
          });
          self.addEventListener("fetch", (event) => {
            if (event.request.method !== "GET" || !event.request.url.startsWith(self.location.origin)) return;
            event.respondWith(fetch(event.request).then((response) => {
              const copy = response.clone();
              caches.open(CACHE).then((cache) => cache.put(event.request, copy));
              return response;
            }).catch(() => caches.match(event.request).then((cached) => cached || (event.request.mode === "navigate" ? caches.match(BASE) : undefined))));
          });\n'''
          Path("public/sw.js").write_text(sw, encoding="utf-8")

          # Generate real PNG icons without external packages.
          def png_bytes(size):
              pix = bytearray([11,13,18,255]) * (size*size)
              def setpx(x,y,c):
                  if 0 <= x < size and 0 <= y < size:
                      i=(y*size+x)*4; pix[i:i+4]=bytes(c)
              def rect(x0,y0,x1,y1,c,r=0):
                  for y in range(y0,y1):
                      for x in range(x0,x1):
                          if r and ((x<x0+r and y<y0+r and (x-(x0+r))**2+(y-(y0+r))**2>r*r) or
                                    (x>=x1-r and y<y0+r and (x-(x1-r-1))**2+(y-(y0+r))**2>r*r) or
                                    (x<x0+r and y>=y1-r and (x-(x0+r))**2+(y-(y1-r-1))**2>r*r) or
                                    (x>=x1-r and y>=y1-r and (x-(x1-r-1))**2+(y-(y1-r-1))**2>r*r)):
                              continue
                          setpx(x,y,c)
              s=size
              rect(int(.18*s),int(.10*s),int(.82*s),int(.90*s),(31,35,45,255),int(.08*s))
              rect(int(.25*s),int(.18*s),int(.75*s),int(.35*s),(217,179,74,255),int(.025*s))
              for row in range(3):
                  for col in range(3):
                      x0=int((.25+col*.17)*s); y0=int((.44+row*.13)*s)
                      rect(x0,y0,x0+int(.10*s),y0+int(.07*s),(67,72,86,255),int(.015*s))
              raw=b''.join(bytes([0])+bytes(pix[y*s*4:(y+1)*s*4]) for y in range(s))
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              png_signature = bytes.fromhex("89504e470d0a1a0a")
              return png_signature+chunk(b'IHDR',struct.pack('>IIBBBBB',s,s,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          Path("public/icons").mkdir(exist_ok=True)
          Path("public/icons/icon-192.png").write_bytes(png_bytes(192))
          Path("public/icons/icon-512.png").write_bytes(png_bytes(512))
          for p in ["public/icons/icon-192.png", "public/icons/icon-512.png"]:
              data = Path(p).read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"Invalid PNG signature: {p}"
              assert data[12:16] == b"IHDR", f"Missing IHDR: {p}"
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              expected = 192 if p.endswith("icon-192.png") else 512
              assert (width, height) == (expected, expected), f"Invalid dimensions: {p} ({width}x{height})"
              assert data[-8:-4] == b"IEND", f"Missing IEND: {p}"
              print(f"OK: {p} ({len(data)} bytes, {width}x{height})")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          import re
          # Remove old manifest/icon tags and install the project-root PWA metadata.
          text = re.sub(r"<link[^>]+rel=['\"]manifest['\"][^>]*>", '', text, flags=re.I)
          text = re.sub(r"<link[^>]+rel=['\"]apple-touch-icon['\"][^>]*>", '', text, flags=re.I)
          head = '<link rel="manifest" href="/settings-calculator/manifest.webmanifest"><meta name="theme-color" content="#0b0d12"><link rel="apple-touch-icon" sizes="192x192" href="/settings-calculator/icons/icon-192.png">'
          text = text.replace("</head>", head + "</head>")
          text = re.sub(r'<script>if\("serviceWorker" in navigator\).*?</script>', '', text, flags=re.S)
          reg = '<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/settings-calculator/sw.js",{scope:"/settings-calculator/"}))}</script>'
          const shareScript = `
<script>
(function(){
  const SHARE_LABEL = "مشاركة واتساب";
  const clean = (s) => s.replace(/\\u00a0/g, " ").replace(/[ \\t]+/g, " ").trim();
  const lines = (s) => s.split(/\\r?\\n/).map(clean).filter(Boolean);
  const findValue = (ls, labels) => {
    for (const line of ls) {
      for (const label of labels) {
        const m = line.match(new RegExp("^" + label + "\\s*[:：-]?\\s*(.+)$"));
        if (m) return clean(m[1]);
      }
    }
    return "";
  };
  function buildMessage(card){
    const ls = lines(card.innerText || "");
    const work = findValue(ls, ["اسم العمل","نوع العمل","العمل"]);
    const shippingIndex = ls.findIndex(x => x.includes("مصاريف الشحن"));
    const totalIndex = ls.findIndex(x => x.startsWith("المجموع"));
    const materialsIndex = ls.findIndex(x => x === "المواد" || x.startsWith("المواد:"));
    let materialLines = [];
    if (materialsIndex >= 0) {
      const end = shippingIndex >= 0 ? shippingIndex : (totalIndex >= 0 ? totalIndex : ls.length);
      materialLines = ls.slice(materialsIndex + 1, end).filter(x => !/^اسم العميل|^التاريخ|^طريقة الدفع|^المدفوع|^المتبقي/.test(x));
    }
    const shipping = shippingIndex >= 0 ? (ls[shippingIndex].split(/[:：]/).slice(1).join(":").trim() || ls[shippingIndex]) : "";
    const total = totalIndex >= 0 ? (ls[totalIndex].split(/[:：]/).slice(1).join(":").trim() || ls[totalIndex]) : "";
    const out = [];
    if (work) out.push("اسم العمل: " + work);
    if (materialLines.length) {
      out.push("", "المواد:", ...materialLines);
    }
    if (shipping) out.push("", "مصاريف الشحن: " + shipping.replace(/^مصاريف الشحن\\s*/, ""));
    if (total) out.push("", "المجموع: " + total.replace(/^المجموع\\s*/, ""));
    return out.join("\\n").trim();
  }
  function addButtons(){
    if (!location.pathname.includes("/settings-calculator")) return;
    const candidates = Array.from(document.querySelectorAll("button")).filter(b => clean(b.textContent || "") === "تعديل");
    for (const edit of candidates) {
      const card = edit.closest("article, [role='article'], .rounded-2xl, .rounded-xl, .border");
      if (!card || card.querySelector("[data-whatsapp-share]")) continue;
      const share = document.createElement("button");
      share.type = "button";
      share.setAttribute("data-whatsapp-share", "true");
      share.textContent = "📤 " + SHARE_LABEL;
      share.style.cssText = "margin-inline-start:8px;border:1px solid hsl(var(--border));border-radius:10px;padding:8px 12px;background:hsl(var(--card)/.7);color:inherit;font-weight:700;font-size:12px;cursor:pointer";
      share.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        const message = buildMessage(card);
        if (!message) return;
        const url = "https://wa.me/?text=" + encodeURIComponent(message);
        window.open(url, "_blank", "noopener,noreferrer");
      });
      edit.parentElement && edit.parentElement.appendChild(share);
    }
  }
  const observer = new MutationObserver(addButtons);
  observer.observe(document.body, {childList:true, subtree:true});
  window.addEventListener("load", addButtons);
  addButtons();
})();
</script>`;
          text = text.replace("</body>", shareScript + "</body>")
          index.write_text(text, encoding="utf-8")
          PY

      - name: Make TypeScript config standalone
        run: |
          python3 - <<'PY'
          import json
          p = "tsconfig.json"
          d = json.load(open(p))
          d.pop("extends", None)
          d.pop("references", None)
          d.setdefault("compilerOptions", {})
          d["compilerOptions"].update({
              "noEmit": True,
              "jsx": "preserve",
              "lib": ["esnext", "dom", "dom.iterable"],
              "resolveJsonModule": True,
              "allowImportingTsExtensions": True,
              "moduleResolution": "bundler",
              "types": ["node", "vite/client"],
              "paths": {"@/*": ["./src/*"]}
          })
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /settings-calculator/
        run: |
          npm run build
          rm -rf "$GITHUB_WORKSPACE/pages"
          mkdir -p "$GITHUB_WORKSPACE/pages"
          cp -R dist/public/. "$GITHUB_WORKSPACE/pages"/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
