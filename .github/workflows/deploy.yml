name: Deploy settings-calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract project
        run: |
          mkdir -p buildspace
          tar -xzf project-backup.tar.gz -C buildspace

      - name: Remove Replit-only build integrations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          root = Path(next((p.parent for p in Path("buildspace").rglob("pnpm-workspace.yaml")), Path("buildspace")))
          for p in root.rglob("package.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              changed = False
              for section in ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies"):
                  if section in data:
                      for name in list(data[section]):
                          if name.startswith("@replit/"):
                              del data[section][name]
                              changed = True
              if changed:
                  p.write_text(json.dumps(data, indent=2) + "\n")

          # Resolve pnpm catalog: specs to concrete versions so this extracted
          # project can build independently of Replit's workspace catalog.
          ws = root / "pnpm-workspace.yaml"
          catalog = {}
          if ws.exists():
              in_catalog = False
              for line in ws.read_text().splitlines():
                  if line.strip() == "catalog:":
                      in_catalog = True
                      continue
                  if in_catalog and line and not line.startswith("  "):
                      break
                  if in_catalog and line.startswith("  ") and ":" in line:
                      name, version = line.strip().split(":", 1)
                      catalog[name.strip("'\"")] = version.strip().strip("'\"")

          for p in root.rglob("package.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              changed = False
              for section in ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies"):
                  if section in data:
                      for name, value in list(data[section].items()):
                          if value == "catalog:" and name in catalog:
                              data[section][name] = catalog[name]
                              changed = True
              if changed:
                  p.write_text(json.dumps(data, indent=2) + "\n")

          for p in root.rglob("vite.config.ts"):
              s = p.read_text()
              s = re.sub(r"^import runtimeErrorOverlay from ['\"]@replit/vite-plugin-runtime-error-modal['\"];\s*\n", "", s, flags=re.M)
              s = re.sub(r"\n\s*runtimeErrorOverlay\(\),", "", s)
              s = re.sub(r"\n\s*\.\.\.\(process\.env\.NODE_ENV !== ['\"]production['\"][\s\S]*?\n\s*\],\n", "\n", s)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: |
          ROOT="$(dirname "$(find buildspace -name pnpm-workspace.yaml -print -quit)")"
          cd "$ROOT"
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --no-frozen-lockfile

      - name: Build application
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /settings-calculator/
        run: |
          ROOT="$(dirname "$(find buildspace -name pnpm-workspace.yaml -print -quit)")"
          cd "$ROOT"
          pnpm --filter @workspace/settings-calculator build
          DIST="$(find . -type d -path "*/artifacts/settings-calculator/dist/public" -print -quit)"
          rm -rf "$GITHUB_WORKSPACE/pages"
          mkdir -p "$GITHUB_WORKSPACE/pages"
          cp -R "$DIST"/. "$GITHUB_WORKSPACE/pages"/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
