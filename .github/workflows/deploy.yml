name: Deploy settings-calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract standalone app
        run: |
          if [ ! -d src ] || [ ! -f package.json ]; then tar -xzf project-backup.tar.gz -C .; else echo "Using tracked extracted application source"; fi
          echo "Application package:"
          find . -maxdepth 4 -path "*/package.json" -print

      - name: Inspect extracted calculator source
        run: |
          echo "=== SOURCE FILES ==="
          find src -type f \( -name "*.tsx" -o -name "*.ts" \) -print | sort
          echo "=== EXPENSE/SHIPPING/LANGUAGE MATCHES ==="
          grep -RniE "مصاريف|الشحن|shipping|language|اللغة|نوع العمل|archive|localStorage" src --include='*.tsx' --include='*.ts' | head -n 300 || true

      - name: Persist extracted application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          files=[Path("src/lib/operations-archive-store.ts"),Path("src/lib/settings-store.ts"),Path("src/lib/settings-transfer.ts"),Path("src/pages/operations-page.tsx"),Path("src/pages/settings-page.tsx"),Path("src/pages/archive-page.tsx"),Path("src/lib/operations-utils.ts")]
          out=[]
          for p in files:
              out.append(f"\\n===== {p} =====\\n")
              out.append(p.read_text(encoding="utf-8"))
          Path("source-bundle.txt").write_text("".join(out),encoding="utf-8")
          PY
          for path in src package.json tsconfig.json index.html public; do
            [ -e "$path" ] && git add -f "$path"
          done
          git add -f source-bundle.txt
          git status --short | head -n 80
          git diff --cached --quiet || git commit -m "chore: persist calculator source"
          git push origin HEAD:main

      - name: Apply calculator enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text(encoding="utf-8")
              if new in s: return
              if old not in s: raise SystemExit("Missing anchor: " + path + " / " + old[:60])
              p.write_text(s.replace(old,new,1),encoding="utf-8")

          patch("src/lib/operations-archive-store.ts","  finalTotal: number;\n};","  additionalExpenses?: number;\n  finalTotal: number;\n};")
          patch("src/lib/operations-archive-store.ts","    && shipping !== undefined\n","    && (record.additionalExpenses === undefined || (typeof record.additionalExpenses === 'number' && Number.isFinite(record.additionalExpenses) && record.additionalExpenses >= 0))\n    && shipping !== undefined\n")

          patch("src/pages/operations-page.tsx","  const [manualShippingValue, setManualShippingValue] = useState('0');\n","  const [manualShippingValue, setManualShippingValue] = useState('0');\n  const [additionalExpensesValue, setAdditionalExpensesValue] = useState('0');\n")
          patch("src/pages/operations-page.tsx","    setManualShippingValue(String(record.shipping.manualAmount));\n","    setManualShippingValue(String(record.shipping.manualAmount));\n    setAdditionalExpensesValue(String(record.additionalExpenses ?? 0));\n")
          patch("src/pages/operations-page.tsx","        setManualShippingValue('0');\n","        setManualShippingValue('0');\n        setAdditionalExpensesValue('0');\n")
          patch("src/pages/operations-page.tsx","  const finalTotal = sectionTotal + shippingTotal;\n","  const additionalExpensesAmount = Math.max(0, Number(formatWesternNumber(additionalExpensesValue).replace(/,/g, '')) || 0);\n  const finalTotal = sectionTotal + shippingTotal + additionalExpensesAmount;\n")
          patch("src/pages/operations-page.tsx","    || (Number.isFinite(manualShippingAmount) && manualShippingAmount !== 0);\n","    || (Number.isFinite(manualShippingAmount) && manualShippingAmount !== 0)\n    || additionalExpensesAmount !== 0;\n")
          patch("src/pages/operations-page.tsx","        included: includeShipping,\n      },\n      finalTotal,\n","        included: includeShipping,\n      },\n      additionalExpenses: additionalExpensesAmount,\n      finalTotal,\n")
          patch("src/pages/operations-page.tsx","                  <div className=\"final-total\" data-testid=\"final-total\">",'''                  <div className="mt-3 rounded-xl border border-[hsl(var(--border))] bg-[hsl(var(--card)/.55)] p-3" data-testid="additional-expenses">
                    <div className="flex items-center justify-between gap-3">
                      <label className="shipping-option m-0 flex-1" data-testid="additional-expenses-toggle">
                        <input type="checkbox" checked={additionalExpensesAmount > 0} onChange={(event) => { cancelAutoAdvance(); if (!event.target.checked) setAdditionalExpensesValue('0'); }} data-testid="checkbox-additional-expenses" />
                        <span>مصاريف إضافية</span>
                      </label>
                      <strong className="font-mono text-xs" dir="ltr">{formatWesternNumber(additionalExpensesAmount.toLocaleString('en-US'))}</strong>
                    </div>
                    {(additionalExpensesAmount > 0 || additionalExpensesValue !== '0') && (
                      <div className="mt-2">
                        <label htmlFor="input-additional-expenses" className="text-xs font-bold">قيمة المصاريف الإضافية لهذه العملية</label>
                        <input id="input-additional-expenses" type="text" inputMode="decimal" dir="ltr" className="field-input mt-2 text-left font-mono" value={additionalExpensesValue} onChange={(event) => { cancelAutoAdvance(); setAdditionalExpensesValue(event.target.value); }} data-testid="input-additional-expenses" />
                      </div>
                    )}
                  </div>
                  <div className="final-total" data-testid="final-total">''')

          patch("src/pages/archive-page.tsx","import { Archive, ChevronDown, Clock3, Layers3, Pencil, Search } from 'lucide-react';","import { Archive, ChevronDown, Clock3, Layers3, Pencil, Search, Share2 } from 'lucide-react';")
          patch("src/pages/archive-page.tsx","function formatArchiveTime(timestamp: number) {",'''function buildWhatsAppMessage(record: ArchivedOperation) {
  const lines = ["اسم العمل: " + record.name];
  if (record.workTypeName) lines.push("نوع العمل: " + record.workTypeName);
  lines.push("", "المواد والأقسام:");
  for (const section of record.sections) {
    lines.push(section.name + " — الكمية: " + formatWesternNumber(section.quantity) + " — المجموع: " + formatAmount(section.result));
    for (const material of section.materials) lines.push("  " + material.name + ": " + formatAmount(material.price));
  }
  if (record.shipping.included) lines.push("", "مصاريف الشحن: " + formatWesternNumber(record.shipping.amount));
  if ((record.additionalExpenses ?? 0) > 0) lines.push("مصاريف إضافية: " + formatWesternNumber(record.additionalExpenses ?? 0));
  lines.push("المجموع النهائي: " + formatAmount(record.finalTotal));
  return lines.join("\n");
}

function formatArchiveTime(timestamp: number) {''')
          patch("src/pages/archive-page.tsx","                  <div className=\"mt-3 flex items-center justify-between gap-3 border-t border-[hsl(var(--border))] pt-3 text-xs\">",'''                  {(record.additionalExpenses ?? 0) > 0 && (
                    <div className="mt-2 flex items-center justify-between gap-3 text-[11px]">
                      <span className="text-[hsl(var(--muted-foreground))]">مصاريف إضافية</span>
                      <strong className="font-mono" dir="ltr">{formatWesternNumber(record.additionalExpenses ?? 0)}</strong>
                    </div>
                  )}
                  <div className="mt-3 flex items-center justify-between gap-3 border-t border-[hsl(var(--border))] pt-3 text-xs">''')
          patch("src/pages/archive-page.tsx",'''                <Link
                  href={`/operations/edit/${encodeURIComponent(record.id)}`}
                  className="operation-link mt-4"
                  aria-label={`تعديل العملية ${record.name}`}
                  data-testid={`button-edit-archive-${record.id}`}
                >
                  <Pencil size={14} />
                  تعديل العملية
                </Link>''','''                <div className="mt-4 flex flex-wrap gap-2">
                  <Link
                    href={`/operations/edit/${encodeURIComponent(record.id)}`}
                    className="operation-link flex-1"
                    aria-label={`تعديل العملية ${record.name}`}
                    data-testid={`button-edit-archive-${record.id}`}
                  >
                    <Pencil size={14} />
                    تعديل العملية
                  </Link>
                  <button type="button" className="operation-link flex-1" onClick={() => window.open("https://wa.me/?text=" + encodeURIComponent(buildWhatsAppMessage(record)), "_blank", "noopener,noreferrer")} data-testid="button-share-whatsapp">
                    <Share2 size={14} />
                    مشاركة واتساب
                  </button>
                </div>''')

          Path("src/lib/language-store.ts").write_text("""export type AppLanguage = 'ar' | 'tr' | 'en';
export const LANGUAGE_STORAGE_KEY = 'settings-calculator-language';
export function loadLanguage(): AppLanguage {
  if (typeof window === 'undefined') return 'ar';
  const value = window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
  return value === 'tr' || value === 'en' ? value : 'ar';
}
export function saveLanguage(language: AppLanguage) {
  window.localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
}
""",encoding="utf-8")
          patch("src/pages/settings-page.tsx","import { reconcileOperationsOrderAfterSettingsChange } from '@/lib/operations-order-store';","import { reconcileOperationsOrderAfterSettingsChange } from '@/lib/operations-order-store';\nimport { loadLanguage, saveLanguage, type AppLanguage } from '@/lib/language-store';")
          patch("src/pages/settings-page.tsx","  const [transferMessage, setTransferMessage] = useState<{ type: 'error' | 'success'; text: string } | null>(null);","  const [transferMessage, setTransferMessage] = useState<{ type: 'error' | 'success'; text: string } | null>(null);\n  const [language, setLanguage] = useState<AppLanguage>(() => loadLanguage());")
          patch("src/pages/settings-page.tsx","  useEffect(() => { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }, []);","  useEffect(() => { saveLanguage(language); document.documentElement.lang = language; document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'; }, [language]);")
          patch("src/pages/settings-page.tsx","          <section className=\"mb-5 rounded-xl border border-[hsl(var(--border))] bg-[hsl(var(--card)/.45)] p-4 sm:p-5\">",'''          <section className="mb-5 rounded-xl border border-[hsl(var(--border))] bg-[hsl(var(--card)/.45)] p-4 sm:p-5" data-testid="language-settings">
            <div className="flex items-start gap-3">
              <div className="flex size-10 shrink-0 items-center justify-center rounded-xl bg-[hsl(var(--accent)/.13)] text-[hsl(var(--accent-foreground))]"><Settings2 size={17} /></div>
              <div className="flex-1">
                <h2 className="text-sm font-extrabold">اللغة / Language / Dil</h2>
                <p className="mt-1 text-xs leading-6 text-[hsl(var(--muted-foreground))]">اختر لغة واجهة التطبيق.</p>
                <select value={language} onChange={(event) => setLanguage(event.target.value as AppLanguage)} className="field-input mt-3" data-testid="select-language">
                  <option value="ar">العربية</option>
                  <option value="tr">Türkçe</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
          </section>
          <section className="mb-5 rounded-xl border border-[hsl(var(--border))] bg-[hsl(var(--card)/.45)] p-4 sm:p-5">''')
          print("enhancements applied")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src
          git diff --cached --quiet || git commit -m "feat: add language selector, additional expenses and WhatsApp sharing"
          git push origin HEAD:main

      - name: Add PWA files
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          from pathlib import Path

          Path("public").mkdir(exist_ok=True)

          manifest = '''{
            "name": "Settings Calculator",
            "short_name": "Calculator",
            "description": "Business pricing calculator",
            "id": "/settings-calculator/",
            "lang": "ar",
            "dir": "rtl",
            "start_url": "/settings-calculator/",
            "scope": "/settings-calculator/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#0b0d12",
            "theme_color": "#0b0d12",
            "icons": [
              {"src":"/settings-calculator/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/settings-calculator/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},
              {"src":"/settings-calculator/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"/settings-calculator/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }\n'''
          Path("public/manifest.webmanifest").write_text(manifest, encoding="utf-8")

          sw = '''const CACHE = "settings-calculator-v4";
          const BASE = "/settings-calculator/";
          self.addEventListener("install", (event) => {
            event.waitUntil(caches.open(CACHE).then((cache) => cache.addAll([BASE, BASE + "manifest.webmanifest"])).then(() => self.skipWaiting()));
          });
          self.addEventListener("activate", (event) => {
            event.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
          });
          self.addEventListener("fetch", (event) => {
            if (event.request.method !== "GET" || !event.request.url.startsWith(self.location.origin)) return;
            event.respondWith(fetch(event.request).then((response) => {
              const copy = response.clone();
              caches.open(CACHE).then((cache) => cache.put(event.request, copy));
              return response;
            }).catch(() => caches.match(event.request).then((cached) => cached || (event.request.mode === "navigate" ? caches.match(BASE) : undefined))));
          });\n'''
          Path("public/sw.js").write_text(sw, encoding="utf-8")

          # Generate real PNG icons without external packages.
          def png_bytes(size):
              pix = bytearray([11,13,18,255]) * (size*size)
              def setpx(x,y,c):
                  if 0 <= x < size and 0 <= y < size:
                      i=(y*size+x)*4; pix[i:i+4]=bytes(c)
              def rect(x0,y0,x1,y1,c,r=0):
                  for y in range(y0,y1):
                      for x in range(x0,x1):
                          if r and ((x<x0+r and y<y0+r and (x-(x0+r))**2+(y-(y0+r))**2>r*r) or
                                    (x>=x1-r and y<y0+r and (x-(x1-r-1))**2+(y-(y0+r))**2>r*r) or
                                    (x<x0+r and y>=y1-r and (x-(x0+r))**2+(y-(y1-r-1))**2>r*r) or
                                    (x>=x1-r and y>=y1-r and (x-(x1-r-1))**2+(y-(y1-r-1))**2>r*r)):
                              continue
                          setpx(x,y,c)
              s=size
              rect(int(.18*s),int(.10*s),int(.82*s),int(.90*s),(31,35,45,255),int(.08*s))
              rect(int(.25*s),int(.18*s),int(.75*s),int(.35*s),(217,179,74,255),int(.025*s))
              for row in range(3):
                  for col in range(3):
                      x0=int((.25+col*.17)*s); y0=int((.44+row*.13)*s)
                      rect(x0,y0,x0+int(.10*s),y0+int(.07*s),(67,72,86,255),int(.015*s))
              raw=b''.join(bytes([0])+bytes(pix[y*s*4:(y+1)*s*4]) for y in range(s))
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              png_signature = bytes.fromhex("89504e470d0a1a0a")
              return png_signature+chunk(b'IHDR',struct.pack('>IIBBBBB',s,s,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          Path("public/icons").mkdir(exist_ok=True)
          Path("public/icons/icon-192.png").write_bytes(png_bytes(192))
          Path("public/icons/icon-512.png").write_bytes(png_bytes(512))
          for p in ["public/icons/icon-192.png", "public/icons/icon-512.png"]:
              data = Path(p).read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"Invalid PNG signature: {p}"
              assert data[12:16] == b"IHDR", f"Missing IHDR: {p}"
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              expected = 192 if p.endswith("icon-192.png") else 512
              assert (width, height) == (expected, expected), f"Invalid dimensions: {p} ({width}x{height})"
              assert data[-8:-4] == b"IEND", f"Missing IEND: {p}"
              print(f"OK: {p} ({len(data)} bytes, {width}x{height})")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          import re
          # Remove old manifest/icon tags and install the project-root PWA metadata.
          text = re.sub(r"<link[^>]+rel=['\"]manifest['\"][^>]*>", '', text, flags=re.I)
          text = re.sub(r"<link[^>]+rel=['\"]apple-touch-icon['\"][^>]*>", '', text, flags=re.I)
          head = '<link rel="manifest" href="/settings-calculator/manifest.webmanifest"><meta name="theme-color" content="#0b0d12"><link rel="apple-touch-icon" sizes="192x192" href="/settings-calculator/icons/icon-192.png">'
          text = text.replace("</head>", head + "</head>")
          text = re.sub(r'<script>if\("serviceWorker" in navigator\).*?</script>', '', text, flags=re.S)
          reg = '<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/settings-calculator/sw.js",{scope:"/settings-calculator/"}))}</script>'
          Path("public/archive-share.js").write_text(Path("archive-share.js").read_text(encoding="utf-8"), encoding="utf-8")
          text = text.replace("</body>", reg + '<script src="/settings-calculator/archive-share.js?v=4"></script></body>')
          index.write_text(text, encoding="utf-8")
          PY

      - name: Make TypeScript config standalone
        run: |
          python3 - <<'PY'
          import json
          p = "tsconfig.json"
          d = json.load(open(p))
          d.pop("extends", None)
          d.pop("references", None)
          d.setdefault("compilerOptions", {})
          d["compilerOptions"].update({
              "noEmit": True,
              "jsx": "preserve",
              "lib": ["esnext", "dom", "dom.iterable"],
              "resolveJsonModule": True,
              "allowImportingTsExtensions": True,
              "moduleResolution": "bundler",
              "types": ["node", "vite/client"],
              "paths": {"@/*": ["./src/*"]}
          })
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /settings-calculator/
        run: |
          npm run build
          rm -rf "$GITHUB_WORKSPACE/pages"
          mkdir -p "$GITHUB_WORKSPACE/pages"
          cp -R dist/public/. "$GITHUB_WORKSPACE/pages"/
          # GitHub Pages serves 404.html for direct refreshes of SPA routes.
          # Without this fallback, refreshing /settings-calculator/<route> shows GitHub's 404 page.
          cp "$GITHUB_WORKSPACE/pages/index.html" "$GITHUB_WORKSPACE/pages/404.html"
          test -s "$GITHUB_WORKSPACE/pages/404.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
