name: Deploy settings-calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract standalone app
        run: |
          tar -xzf project-backup.tar.gz -C .
          echo "Application package:"
          find . -maxdepth 4 -path "*/package.json" -print

      - name: Install dependencies
        run: |
          APP="$(dirname "$(find . -path "*/package.json" -print -quit)")"
          cd "$APP"
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /settings-calculator/
        run: |
          APP="$(dirname "$(find . -path "*/package.json" -print -quit)")"
          cd "$APP"
          npm run build
          rm -rf "$GITHUB_WORKSPACE/pages"
          mkdir -p "$GITHUB_WORKSPACE/pages"
          cp -R dist/public/. "$GITHUB_WORKSPACE/pages"/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
