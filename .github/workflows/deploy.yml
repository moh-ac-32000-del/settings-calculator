name: Deploy settings-calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract project
        run: |
          tar -xzf project-backup.tar.gz -C .

      - name: Remove Replit-only build integrations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          root = Path(next((p.parent for p in Path(".").rglob("pnpm-workspace.yaml")), Path(".")))
          for p in root.rglob("package.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              changed = False
              for section in ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies"):
                  if section in data:
                      for name in list(data[section]):
                          if name.startswith("@replit/"):
                              del data[section][name]
                              changed = True
              if changed:
                  p.write_text(json.dumps(data, indent=2) + "\n")

          # Replace catalog: references with concrete versions for standalone CI.
          catalog = {
              "@tailwindcss/vite": "^4.1.14",
              "@tanstack/react-query": "^5.90.21",
              "@types/node": "^25.3.3",
              "@types/react": "^19.2.0",
              "@types/react-dom": "^19.2.0",
              "@vitejs/plugin-react": "^5.0.4",
              "class-variance-authority": "^0.7.1",
              "clsx": "^2.1.1",
              "framer-motion": "^12.23.24",
              "lucide-react": "^0.545.0",
              "react": "19.1.0",
              "react-dom": "19.1.0",
              "tailwind-merge": "^3.3.1",
              "tailwindcss": "^4.1.14",
              "tsx": "^4.21.0",
              "vite": "^7.3.2",
              "wouter": "^3.3.5",
              "zod": "^3.25.76"
          }

          for p in root.rglob("package.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              changed = False
              for section in ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies"):
                  if section in data:
                      for name, value in list(data[section].items()):
                          if value == "catalog:" and name in catalog:
                              data[section][name] = catalog[name]
                              changed = True
              if changed:
                  p.write_text(json.dumps(data, indent=2) + "\n")

          for p in root.rglob("vite.config.ts"):
              s = p.read_text()
              s = re.sub(r"^import runtimeErrorOverlay from ['\"]@replit/vite-plugin-runtime-error-modal['\"];\s*\n", "", s, flags=re.M)
              s = re.sub(r"\n\s*runtimeErrorOverlay\(\),", "", s)
              s = re.sub(r"\n\s*\.\.\.\(process\.env\.NODE_ENV !== ['\"]production['\"][\s\S]*?\n\s*\],\n", "\n", s)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: |
          ROOT="$(dirname "$(find . -name pnpm-workspace.yaml -print -quit)")"
          cd "$ROOT"
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --no-frozen-lockfile

      - name: Build application
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /settings-calculator/
        run: |
          ROOT="$(dirname "$(find . -name pnpm-workspace.yaml -print -quit)")"
          cd "$ROOT"
          pnpm --filter @workspace/settings-calculator build
          DIST="$(find . -type d -path "*/artifacts/settings-calculator/dist/public" -print -quit)"
          rm -rf "$GITHUB_WORKSPACE/pages"
          mkdir -p "$GITHUB_WORKSPACE/pages"
          cp -R "$DIST"/. "$GITHUB_WORKSPACE/pages"/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
